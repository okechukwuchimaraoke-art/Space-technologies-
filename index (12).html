<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>SPACE</title>
<style>
:root{--bg:#f3f5fb;--sf:#fff;--sf2:#e9edf7;--tx:#10142a;--mu:#5d6585;--ln:#d8deee;--a:#0a9bc4;--b:#6a3df0;--g:linear-gradient(135deg,var(--a),var(--b));--gl:rgba(106,61,240,.14);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05060f;--sf:#0e1124;--sf2:#161a33;--tx:#eef1ff;--mu:#8b93b8;--ln:#232848;--a:#32e0ff;--b:#8b5cff;--gl:rgba(139,92,255,.22);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#05060f;--sf:#0e1124;--sf2:#161a33;--tx:#eef1ff;--mu:#8b93b8;--ln:#232848;--a:#32e0ff;--b:#8b5cff;--gl:rgba(139,92,255,.22);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 20% -10%,var(--gl),transparent 50%),radial-gradient(circle at 100% 110%,var(--gl),transparent 45%),var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100%;max-width:560px;margin:auto;display:flex;flex-direction:column}
#view{flex:1;overflow-y:auto;padding:0 18px 18px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:var(--tx);width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;outline:0}
input:focus{border-color:var(--a);box-shadow:0 0 0 3px var(--gl)}
label{display:block;font-size:13px;color:var(--mu);margin:14px 0 6px}
header{display:flex;align-items:center;gap:10px;padding:16px 0 10px;position:sticky;top:0;background:transparent;z-index:2}
header h1{margin:0;font-size:24px;flex:1;letter-spacing:.2px}
.ib{width:42px;height:42px;border-radius:14px;background:var(--sf);border:1px solid var(--ln);display:grid;place-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:16px;font-weight:600;background:var(--g);color:#fff;box-shadow:0 8px 28px var(--gl)}
.btn.o{background:var(--sf);color:var(--tx);border:1px solid var(--ln);box-shadow:none}
.logo{font-weight:800;letter-spacing:.42em;font-size:34px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:-.42em}
.orb{width:140px;height:140px;border-radius:50%;margin:0 auto 26px;background:conic-gradient(from 200deg,var(--a),var(--b),var(--a));filter:blur(.3px);box-shadow:0 0 70px var(--gl);display:grid;place-items:center}
.orb::after{content:"";width:118px;height:118px;border-radius:50%;background:var(--bg)}
.center{min-height:100%;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:12px;padding:24px 0}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:14px 16px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--sf2);border-radius:14px;padding:12px;font-size:13px;color:var(--mu);margin:10px 0}
.note .i{width:18px;height:18px;color:var(--a);margin-top:2px}
.chips{display:flex;gap:8px;margin:6px 0 14px;overflow-x:auto}
.chip{padding:8px 14px;border-radius:99px;background:var(--sf);border:1px solid var(--ln);font-size:14px;white-space:nowrap}
.chip.on{background:var(--g);color:#fff;border-color:transparent}
.empty{text-align:center;padding:36px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ring{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--b);color:var(--a);box-shadow:0 0 36px var(--gl)}
.empty .ring .i{width:30px;height:30px}
.empty h3{margin:4px 0 0}
.av{width:56px;height:56px;border-radius:50%;background:var(--g);display:grid;place-items:center;color:#fff;flex:none}
.av.lg{width:104px;height:104px}.av.lg .i{width:44px;height:44px}
.story{position:relative;padding:3px;border-radius:50%;background:conic-gradient(var(--a),var(--b),var(--a));width:68px;height:68px;display:grid;place-items:center}
.story.d{background:var(--ln)}
.story>div{width:100%;height:100%;border-radius:50%;background:var(--sf);display:grid;place-items:center;color:var(--a)}
.row{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--ln);width:100%;text-align:left}
.row .i{color:var(--a)}.row b{display:block;font-weight:600}.row .mu{display:block;font-size:13px}.row .ch{margin-left:auto;transform:rotate(180deg);color:var(--mu)}
.seg{display:flex;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:10px;font-size:14px}
.seg .on{background:var(--g);color:#fff}
#tabs{display:flex;border-top:1px solid var(--ln);background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(14px);padding:6px 6px 8px}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:11px;color:var(--mu);border-radius:14px}
#tabs .on{color:var(--a)}#tabs .on .i{filter:drop-shadow(0 0 6px var(--a))}
.chat{display:flex;flex-direction:column;height:100%}
.chat .body{flex:1;overflow:auto;display:flex;flex-direction:column;justify-content:center}
.comp{display:flex;gap:8px;align-items:center;padding:8px 0}
.comp input{border-radius:99px;flex:1}
.sheet{display:none;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 0}
.sheet.show{display:grid}
.sheet button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mu);background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 0}
.sheet .i{color:var(--a)}
.call{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:40px 0 20px}
.ctl{display:flex;gap:14px;justify-content:center}
.ctl button{width:60px;height:60px;border-radius:50%;background:var(--sf2);display:grid;place-items:center}
.ctl .end{background:#e5384f;color:#fff}.ctl .end .i{transform:rotate(135deg)}
.vid{width:100%;flex:1;margin:16px 0;border-radius:24px;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center;color:var(--mu);font-size:14px;padding:20px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--sf);border:1px solid var(--a);padding:12px 16px;border-radius:14px;font-size:14px;max-width:88%;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 30px var(--gl);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){#app{max-width:980px;flex-direction:row-reverse}#tabs{flex-direction:column;justify-content:flex-start;width:96px;border-top:0;border-right:1px solid var(--ln);padding-top:24px;gap:6px}#view{padding:0 40px 24px}}
.err{color:#ff5d73;font-size:14px;margin-top:12px;min-height:20px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--mu)}.dot.on{background:#2ee59d;box-shadow:0 0 8px #2ee59d}.dot.away{background:#ffb020}
img.av{object-fit:cover;background:var(--sf2)}.row>.av{width:48px;height:48px}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:8px 0}
.b{max-width:80%;padding:9px 13px;border-radius:18px;overflow-wrap:anywhere;white-space:pre-wrap}.b.me{align-self:flex-end;background:var(--g);color:#fff;border-bottom-right-radius:6px}.b.th{align-self:flex-start;background:var(--sf);border:1px solid var(--ln);border-bottom-left-radius:6px}.t{font-size:11px;opacity:.7;margin-top:2px;text-align:right}
#view:has(.chat){overflow:hidden;padding-bottom:0}.chat{height:100%}
.sheet label{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mu);background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 0;margin:0;cursor:pointer}
.mi{max-width:100%;max-height:320px;border-radius:12px;display:block}.b .med{min-width:120px}.b .mu{color:inherit;opacity:.8}
.story .av{width:100%;height:100%}
.sv{position:fixed;inset:0;z-index:20;background:#000;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.svm{flex:1;display:grid;place-items:center;min-height:0}.svm img,.svm video{max-width:100%;max-height:100%}
.svh{display:flex;align-items:center;gap:10px;padding:10px 14px}.svh .av{width:36px;height:36px}.svh .mu{color:#ffffffaa}.svh .ib{background:#ffffff22;border-color:transparent;color:#fff}
.svbar{display:flex;gap:4px;padding:8px 12px 0}.svbar i{flex:1;height:3px;border-radius:2px;background:#ffffff55}.svbar i.d{background:#fff}
.msgs{border-radius:20px;padding:12px}@keyframes wp{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.b.th{background:color-mix(in srgb,var(--sf) 82%,transparent);backdrop-filter:blur(8px)}
.msgs[data-bs=glass] .b.me{background:rgba(255,255,255,.22);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.4);box-shadow:none}
.msgs[data-bs=solid] .b.me{background:var(--b);box-shadow:none}.msgs[data-bs=glow] .b.me{box-shadow:0 0 18px var(--gl)}
.tk{margin-left:4px;opacity:.8}.tk.rd{color:#b6ff6b;opacity:1;text-shadow:0 0 8px #b6ff6b}
.wh{filter:blur(7px);cursor:pointer;user-select:none;transition:filter .2s}.wh.on{filter:none}
.wpk{display:none;gap:8px;overflow-x:auto;padding:4px 0 10px;align-items:center}.wpk.show{display:flex}
.sw{width:38px;height:38px;border-radius:50%;flex:none;border:2px solid var(--ln)}.sw.on{border-color:var(--tx)}
.sheet{grid-template-columns:repeat(5,1fr)}
.tp{color:var(--a)}.tp::after{content:'';animation:dots 1.2s infinite}@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div id="app"><div id="view"></div><nav id="tabs"></nav></div>
<div id="toast"></div>
<div id="inc" class="sv" style="display:none"></div>
<script>
const P={palette:'M12 3a9 9 0 1 0 0 18c1.5 0 2-1 1.5-2-.6-1.3.3-2.5 1.7-2.5H17a4 4 0 0 0 4-4c0-5-4-9.5-9-9.5zM7.5 12h.01M9 8h.01M14 7.5h.01M17 10.5h.01',chat:'M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z',story:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8v8M8 12h8',phone:'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',plus:'M12 5v14M5 12h14',back:'M15 5l-7 7 7 7',search:'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 21l-4-4',mic:'M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3',send:'M4 12l16-8-6 16-2-7-8-1z',clip:'M20 11l-8 8a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-8 8a2 2 0 0 1-3-3l7-7',video:'M3 7h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H3zM16 11l5-3v8l-5-3',image:'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M9 9h.01',lock:'M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3',users:'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2 20a7 7 0 0 1 14 0M16 4a3.5 3.5 0 0 1 0 7M18 14a7 7 0 0 1 4 6',sliders:'M4 7h10M18 7h2M4 17h2M10 17h10M16 4v6M8 14v6',moon:'M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z',cam:'M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z',spk:'M4 9v6h4l5 4V5L8 9zM17 8a5 5 0 0 1 0 8',bell:'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4',info:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v6M12 7.5h.01',file:'M6 3h8l4 4v14H6zM14 3v4h4'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const soon=(s,t)=>`data-soon="${t} (Stage ${s})"`;
const hd=(t,o={})=>`<header>${o.back?`<button class="ib" data-back aria-label="Back">${ic('back')}</button>`:''}<h1>${t}</h1>${o.r||''}</header>`;
const note=t=>`<div class="note">${ic('info')}<span>${t}</span></div>`;
const row=(i,t,s,a)=>`<button class="row" ${a}>${ic(i)}<span><b>${t}</b><span class="mu">${s}</span></span><span class="ch">${ic('back')}</span></button>`;
const empty=(i,h,p,b='')=>`<div class="empty"><div class="ring">${ic(i)}</div><h3>${h}</h3><p class="mu" style="margin:0;max-width:300px">${p}</p>${b}</div>`;
const field=(l,t='text',ph='',id='')=>`<label>${l}</label><input id="${id}" type="${t}" placeholder="${ph}" autocomplete="${t==='password'?'current-password':'off'}">`;
const avu=(p,c='')=>{const u=p&&p.avatar_url;return u&&u.startsWith(URL_+'/storage/')?`<img class="av ${c}" alt="" src="${esc(u)}">`:av(c)};
function pres(p){const age=Date.now()-new Date(p.last_seen).getTime();if(p.status!=='invisible'&&age<75000)return p.status==='away'?['away','Away']:['on','Online'];if(p.status==='invisible')return['off','Offline'];const m=Math.floor(age/60000);return['off',m<1?'Last seen just now':m<60?'Last seen '+m+' min ago':m<1440?'Last seen '+Math.floor(m/60)+' h ago':'Last seen '+new Date(p.last_seen).toLocaleDateString()]}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const av=(c='')=>`<div class="av ${c}">${ic('user')}</div>`;

const cmp=()=>`<div class="sheet" id="sheet"><label><input type="file" accept="image/*" data-mkind="image" hidden>${ic('image')}Photo</label><label><input type="file" accept="video/*" data-mkind="video" hidden>${ic('video')}Video</label><label><input type="file" accept="image/*" capture="environment" data-mkind="image" hidden>${ic('cam')}Camera</label><label><input type="file" data-mkind="file" hidden>${ic('file')}File</label><button type="button" data-whisper>${ic('moon')}Whisper</button></div><div id="recbar" class="comp" style="display:none"><button type="button" class="ib" data-rcx aria-label="Cancel">${ic('x')}</button><span style="flex:1;color:#ff5d73">● Recording <span id="rt">0:00</span></span><button type="button" class="ib" data-rcs aria-label="Send" style="background:var(--g);color:#fff;border:0">${ic('send')}</button></div><form id="f-msg" class="comp" autocomplete="off"><button type="button" class="ib" data-sheet aria-label="Attach">${ic('clip')}</button><input id="mt" placeholder="Message" autocomplete="off"><button type="button" class="ib" data-rec aria-label="Voice message">${ic('mic')}</button><button type="submit" class="ib" aria-label="Send" style="background:var(--g);color:#fff;border:0">${ic('send')}</button></form>`;
const R={
welcome:[0,()=>`<div class="center"><div class="orb"></div><div class="logo">SPACE</div><p class="mu" style="margin:0 0 18px">Private conversations, beautifully connected.</p><button class="btn" data-go="register">Create account</button><button class="btn o" data-go="login">Sign in</button>${note('Accounts and profiles are real. Messaging, calls and the rest arrive in later stages.')}</div>`],
login:[0,()=>`${hd('Welcome back',{back:1})}<form id="f-login" novalidate>${field('Email','email','you@example.com','email')}${field('Password','password','Your password','pw')}<div class="err" id="err"></div><div style="height:16px"></div><button class="btn" type="submit">Sign in</button></form><p class="mu" style="text-align:center">New here? <a href="#register" style="color:var(--a)">Create an account</a></p>`],
register:[0,()=>`${hd('Join SPACE',{back:1})}<form id="f-reg" novalidate>${field('Display name','text','Your name','dn')}${field('Username','text','@username','un')}${field('Email','email','you@example.com','email')}${field('Password','password','At least 8 characters','pw')}<div class="err" id="err"></div><div style="height:16px"></div><button class="btn" type="submit">Create account</button></form><p class="mu" style="text-align:center">Have an account? <a href="#login" style="color:var(--a)">Sign in</a></p>`],
chats:[1,()=>`${hd('Chats',{r:`<button class="ib" data-go="people" aria-label="Search">${ic('search')}</button><button class="ib" data-go="new" aria-label="New chat">${ic('plus')}</button>`})}<div class="chips"><span class="chip on">All</span></div><div id="list">${listHtml()}</div>`],
new:[1,()=>`${hd('New',{back:1})}<input placeholder="Search by username" disabled>${row('user','New message','Find people by username','data-go="people"')}${row('users','New group','Create a group chat','data-go="group"')}`],
group:[1,()=>`${hd('New group',{back:1})}<form id="f-group" novalidate><label>Group name</label><input id="gn" maxlength="50" placeholder="e.g. Weekend plans" value="${esc(S.gdraft.name)}"><label>Add people by exact username</label><div style="display:flex;gap:8px"><input id="gu" placeholder="username" autocapitalize="none"><button type="button" class="ib" style="width:auto;padding:0 16px" data-gadd>Add</button></div>${S.gdraft.members.map(u=>`<div class="row" style="padding:8px 4px">${avu(u)}<span><b>${esc(u.display_name)}</b><span class="mu">@${esc(u.username)}</span></span><button type="button" class="ib" style="margin-left:auto" data-grm="${u.id}" aria-label="Remove">${ic('x')}</button></div>`).join('')}<div class="err" id="err"></div><div style="height:16px"></div><button class="btn" type="submit">Create group</button></form>`],
gchat:[0,()=>{const g=S.group||{};return `<div class="chat">${hd(`${esc(g.name)}<span class="mu" id="hs" style="display:block;font-size:12px;font-weight:400">${(g.members||[]).length} members</span>`,{back:1,r:`<button class="ib" data-wp aria-label="Wallpaper">${ic('palette')}</button><button class="ib" data-go="ginfo" aria-label="Group info">${ic('users')}</button>`})}<div class="wpk" id="wpk"></div><div class="msgs" id="msgs"></div>${cmp()}</div>`}],
ginfo:[0,()=>{const g=S.group||{members:[]},mine=g.created_by===me();return `${hd(esc(g.name),{back:1})}<div class="card"><b>${g.members.length} members</b></div>${g.members.map(id=>{const p=id===me()?S.p:(S.peers[id]||{});return `<div class="row">${avu(p)}<span><b>${esc(p.display_name)}${id===me()?' (you)':''}${id===g.created_by?' · creator':''}</b><span class="mu">@${esc(p.username)}</span></span></div>`}).join('')}${mine?`<label>Add person by exact username</label><div style="display:flex;gap:8px"><input id="gu" placeholder="username" autocapitalize="none"><button type="button" class="ib" style="width:auto;padding:0 16px" data-gadd>Add</button></div><div class="err" id="err"></div>${note('The creator cannot leave yet, and removing members is not available yet.')}`:`<button class="btn o" style="margin-top:18px" data-gleave>Leave group</button>`}`}],
