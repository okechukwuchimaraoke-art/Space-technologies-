<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>SPACE</title>
<style>
:root{--bg:#f3f5fb;--sf:#fff;--sf2:#e9edf7;--tx:#10142a;--mu:#5d6585;--ln:#d8deee;--a:#0a9bc4;--b:#6a3df0;--g:linear-gradient(135deg,var(--a),var(--b));--gl:rgba(106,61,240,.14);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05060f;--sf:#0e1124;--sf2:#161a33;--tx:#eef1ff;--mu:#8b93b8;--ln:#232848;--a:#32e0ff;--b:#8b5cff;--gl:rgba(139,92,255,.22);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#05060f;--sf:#0e1124;--sf2:#161a33;--tx:#eef1ff;--mu:#8b93b8;--ln:#232848;--a:#32e0ff;--b:#8b5cff;--gl:rgba(139,92,255,.22);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 20% -10%,var(--gl),transparent 50%),radial-gradient(circle at 100% 110%,var(--gl),transparent 45%),var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100%;max-width:560px;margin:auto;display:flex;flex-direction:column}
#view{flex:1;overflow-y:auto;padding:0 18px 18px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:var(--tx);width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;outline:0}
input:focus{border-color:var(--a);box-shadow:0 0 0 3px var(--gl)}
label{display:block;font-size:13px;color:var(--mu);margin:14px 0 6px}
header{display:flex;align-items:center;gap:10px;padding:16px 0 10px;position:sticky;top:0;background:transparent;z-index:2}
header h1{margin:0;font-size:24px;flex:1;letter-spacing:.2px}
.ib{width:42px;height:42px;border-radius:14px;background:var(--sf);border:1px solid var(--ln);display:grid;place-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:16px;font-weight:600;background:var(--g);color:#fff;box-shadow:0 8px 28px var(--gl)}
.btn.o{background:var(--sf);color:var(--tx);border:1px solid var(--ln);box-shadow:none}
.logo{font-weight:800;letter-spacing:.42em;font-size:34px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:-.42em}
.orb{width:140px;height:140px;border-radius:50%;margin:0 auto 26px;background:conic-gradient(from 200deg,var(--a),var(--b),var(--a));filter:blur(.3px);box-shadow:0 0 70px var(--gl);display:grid;place-items:center}
.orb::after{content:"";width:118px;height:118px;border-radius:50%;background:var(--bg)}
.center{min-height:100%;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:12px;padding:24px 0}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:14px 16px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--sf2);border-radius:14px;padding:12px;font-size:13px;color:var(--mu);margin:10px 0}
.note .i{width:18px;height:18px;color:var(--a);margin-top:2px}
.chips{display:flex;gap:8px;margin:6px 0 14px;overflow-x:auto}
.chip{padding:8px 14px;border-radius:99px;background:var(--sf);border:1px solid var(--ln);font-size:14px;white-space:nowrap}
.chip.on{background:var(--g);color:#fff;border-color:transparent}
.empty{text-align:center;padding:36px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ring{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--b);color:var(--a);box-shadow:0 0 36px var(--gl)}
.empty .ring .i{width:30px;height:30px}
.empty h3{margin:4px 0 0}
.av{width:56px;height:56px;border-radius:50%;background:var(--g);display:grid;place-items:center;color:#fff;flex:none}
.av.lg{width:104px;height:104px}.av.lg .i{width:44px;height:44px}
.story{position:relative;padding:3px;border-radius:50%;background:conic-gradient(var(--a),var(--b),var(--a));width:68px;height:68px;display:grid;place-items:center}
.story.d{background:var(--ln)}
.story>div{width:100%;height:100%;border-radius:50%;background:var(--sf);display:grid;place-items:center;color:var(--a)}
.row{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--ln);width:100%;text-align:left}
.row .i{color:var(--a)}.row b{display:block;font-weight:600}.row .mu{display:block;font-size:13px}.row .ch{margin-left:auto;transform:rotate(180deg);color:var(--mu)}
.seg{display:flex;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:10px;font-size:14px}
.seg .on{background:var(--g);color:#fff}
#tabs{display:flex;border-top:1px solid var(--ln);background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(14px);padding:6px 6px 8px}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:11px;color:var(--mu);border-radius:14px}
#tabs .on{color:var(--a)}#tabs .on .i{filter:drop-shadow(0 0 6px var(--a))}
.chat{display:flex;flex-direction:column;height:100%}
.chat .body{flex:1;overflow:auto;display:flex;flex-direction:column;justify-content:center}
.comp{display:flex;gap:8px;align-items:center;padding:8px 0}
.comp input{border-radius:99px;flex:1}
.sheet{display:none;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 0}
.sheet.show{display:grid}
.sheet button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mu);background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 0}
.sheet .i{color:var(--a)}
.call{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:40px 0 20px}
.ctl{display:flex;gap:14px;justify-content:center}
.ctl button{width:60px;height:60px;border-radius:50%;background:var(--sf2);display:grid;place-items:center}
.ctl .end{background:#e5384f;color:#fff}.ctl .end .i{transform:rotate(135deg)}
.vid{width:100%;flex:1;margin:16px 0;border-radius:24px;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center;color:var(--mu);font-size:14px;padding:20px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--sf);border:1px solid var(--a);padding:12px 16px;border-radius:14px;font-size:14px;max-width:88%;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 30px var(--gl);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){#app{max-width:980px;flex-direction:row-reverse}#tabs{flex-direction:column;justify-content:flex-start;width:96px;border-top:0;border-right:1px solid var(--ln);padding-top:24px;gap:6px}#view{padding:0 40px 24px}}
.err{color:#ff5d73;font-size:14px;margin-top:12px;min-height:20px}
</style>
</head>

<script>
const P={chat:'M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z',story:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8v8M8 12h8',phone:'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',plus:'M12 5v14M5 12h14',back:'M15 5l-7 7 7 7',search:'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 21l-4-4',mic:'M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3',send:'M4 12l16-8-6 16-2-7-8-1z',clip:'M20 11l-8 8a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-8 8a2 2 0 0 1-3-3l7-7',video:'M3 7h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H3zM16 11l5-3v8l-5-3',image:'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M9 9h.01',lock:'M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3',users:'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2 20a7 7 0 0 1 14 0M16 4a3.5 3.5 0 0 1 0 7M18 14a7 7 0 0 1 4 6',sliders:'M4 7h10M18 7h2M4 17h2M10 17h10M16 4v6M8 14v6',moon:'M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z',cam:'M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z',spk:'M4 9v6h4l5 4V5L8 9zM17 8a5 5 0 0 1 0 8',bell:'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4',info:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v6M12 7.5h.01',file:'M6 3h8l4 4v14H6zM14 3v4h4'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;

const R={

new:[1,()=>`${hd('New',{back:1})}<input placeholder="Search by username" disabled>${row('user','New message','Chat privately with one person',soon(4,'Messaging connects'))}${row('users','New group','Create a group chat','data-go="group"')}${note('Finding people needs accounts, which arrive in Stage 2.')}`],
group:[1,()=>`${hd('New group',{back:1})}<div style="text-align:center;margin:10px 0">${av('lg')}<p class="mu">Group photo</p></div>${field('Group name','text','e.g. Weekend plans')}${row('users','Add members','No contacts yet',soon(5,'Groups connect'))}<div style="height:18px"></div><button class="btn" ${soon(5,'Groups connect')}>Create group</button>`],
chat:[0,()=>`<div class="chat">${hd('Conversation',{back:1,r:`<button class="ib" data-go="call" aria-label="Voice call">${ic('phone')}</button><button class="ib" data-go="vcall" aria-label="Video call">${ic('video')}</button>`})}<div class="body">${empty('lock','End-to-end encrypted','Messages in this chat will be readable only by the people in it. This is a layout preview, with no real conversation.')}</div><div class="sheet" id="sheet"><button ${soon(6,'Photos connect')}>${ic('image')}Photo</button><button ${soon(6,'Video sharing connects')}>${ic('video')}Video</button><button ${soon(6,'Camera connects')}>${ic('cam')}Camera</button><button ${soon(6,'Files connect')}>${ic('file')}File</button></div><div class="comp"><button class="ib" data-sheet aria-label="Attach">${ic('clip')}</button><input placeholder="Message" disabled><button class="ib" ${soon(6,'Voice messages connect')} aria-label="Voice message">${ic('mic')}</button><button class="ib" ${soon(4,'Sending connects')} aria-label="Send" style="background:var(--g);color:#fff;border:0">${ic('send')}</button></div></div>`],

calls:[3,()=>`${hd('Calls')}${empty('phone','No calls yet','Voice and video calls with your contacts will be listed here.',`<a class="mu" href="#call" style="color:var(--a)">Preview voice call screen</a><a class="mu" href="#vcall" style="color:var(--a)">Preview video call screen</a>`)}`],
call:[0,()=>`<div class="call"><div>${av('lg')}<h2 style="margin:16px 0 4px">Voice call</h2><span class="mu">Layout preview, not connected</span></div><div class="ctl"><button ${soon(8,'Mute connects')}>${ic('mic')}</button><button ${soon(8,'Speaker connects')}>${ic('spk')}</button><button data-back class="end" aria-label="End">${ic('phone')}</button></div></div>`],
vcall:[0,()=>`<div class="call" style="padding-top:20px"><div><h2 style="margin:0 0 4px">Video call</h2><span class="mu">Layout preview, not connected</span></div><div class="vid">Remote video appears here</div><div class="ctl"><button ${soon(8,'Mute connects')}>${ic('mic')}</button><button ${soon(8,'Camera connects')}>${ic('cam')}</button><button ${soon(8,'Speaker connects')}>${ic('spk')}</button><button data-back class="end" aria-label="End">${ic('phone')}</button></div></div>`],
profile:[4,()=>`${hd('Profile')}<div style="text-align:center">${av('lg')}<h2 style="margin:12px 0 0">${esc(S.p?.display_name||'Your name')}</h2><span class="mu">@${esc(S.p?.username||'username')}</span></div><div class="chips" style="justify-content:center;margin-top:14px"><span class="chip on" ${soon(3,'Status connects')}>Online</span><span class="chip" ${soon(3,'Status connects')}>Away</span><span class="chip" ${soon(3,'Status connects')}>Invisible</span></div>${row('user','Edit profile','Photo, name, bio','data-go="edit"')}${row('lock','Privacy and encryption','How your messages are protected','data-go="privacy"')}${row('bell','Notifications','Message and call alerts',soon(4,'Notifications connect'))}<div class="card" style="margin-top:16px"><b>Appearance</b><div class="seg" style="margin-top:10px"><button data-th="system">System</button><button data-th="dark">Dark</button><button data-th="light">Light</button></div></div><button class="btn o" data-out style="margin-top:16px">Sign out</button>`],

const URL_='https://qszpmwfwngccejyctvyl.supabase.co',KEY='sb_publishable_M7DfdrvcURHo5opQroO08g_JekrvYdv';
const S={session:null,p:null};
try{S.session=JSON.parse(localStorage.getItem('space.s')||'null')}catch(e){}
function save(j){if(j&&!j.expires_at)j.expires_at=Math.floor(Date.now()/1000)+(j.expires_in||3600);S.session=j;try{j?localStorage.setItem('space.s',JSON.stringify(j)):localStorage.removeItem('space.s')}catch(e){}}
async function api(path,o={}){const r=await fetch(URL_+path,{method:o.method||'GET',headers:Object.assign({apikey:KEY,'Content-Type':'application/json'},o.token?{Authorization:'Bearer '+o.token}:{}),body:o.body?JSON.stringify(o.body):undefined});
const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
if(!r.ok)throw new Error((j&&(j.msg||j.error_description||j.message))||'Request failed ('+r.status+')');return j}
async function fresh(){const s=S.session;if(!s)return null;if(s.expires_at*1000-Date.now()>60000)return s.access_token;
const j=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:s.refresh_token}});save(j);return j.access_token}
async function loadProfile(){const t=await fresh();const r=await api('/rest/v1/profiles?id=eq.'+S.session.user.id+'&select=username,display_name',{token:t});S.p=r&&r[0]||null}
async function out(){try{await api('/auth/v1/logout',{method:'POST',token:S.session.access_token})}catch(e){}save(null);S.p=null;location.hash='welcome'}
const V=document.getElementById('view'),T=document.getElementById('tabs');
const tabs=[['chats','chat','Chats'],['stories','story','Stories'],['calls','phone','Calls'],['profile','user','Profile']];
function show(){let n=location.hash.slice(1);if(!R[n])n='welcome';const pub=['welcome','login','register'].includes(n);if(!S.session&&!pub){location.hash='welcome';return}if(S.session&&pub){location.hash='chats';return}const [t,f]=R[n];V.innerHTML=f();V.scrollTop=0;
T.style.display=t?'flex':'none';T.innerHTML=tabs.map((x,i)=>`<button class="${i+1===t?'on':''}" data-go="${x[0]}">${ic(x[1])}${x[2]}</button>`).join('');syncTh()}
function syncTh(){const c=document.documentElement.dataset.theme||'system';document.querySelectorAll('[data-th]').forEach(b=>b.classList.toggle('on',b.dataset.th===c))}
let tt;function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2600)}
document.addEventListener('click',e=>{let x;
if(x=e.target.closest('[data-go]')){location.hash=x.dataset.go}
else if(e.target.closest('[data-back]')){history.length>1?history.back():location.hash='chats'}
else if(x=e.target.closest('[data-soon]')){toast('Not connected yet. '+x.dataset.soon.replace('(',' arrives in ').replace(')','.'))}
else if(x=e.target.closest('[data-th]')){x.dataset.th==='system'?delete document.documentElement.dataset.theme:document.documentElement.dataset.theme=x.dataset.th;syncTh()}
else if(e.target.closest('[data-out]')){out()}
else if(e.target.closest('[data-sheet]')){document.getElementById('sheet').classList.toggle('show')}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,q=k=>f.querySelector('#'+k).value.trim(),er=f.querySelector('#err'),b=f.querySelector('[type=submit]'),txt=b.textContent;er.textContent='';
try{const em=q('email'),pw=f.querySelector('#pw').value;let j;
if(!/^\S+@\S+\.\S+$/.test(em))throw new Error('Enter a valid email address.');
if(f.id==='f-reg'){const dn=q('dn'),un=q('un').replace(/^@/,'').toLowerCase();
if(!dn)throw new Error('Enter your display name.');
if(!/^[a-z0-9_]{3,20}$/.test(un))throw new Error('Username: 3–20 letters, numbers or underscores.');
if(pw.length<8)throw new Error('Password must be at least 8 characters.');
